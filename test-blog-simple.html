<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Blog Simple - JS Industrie</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .status {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .warning { background: #fff3cd; color: #856404; }
        .article-card {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            background: white;
        }
        button {
            background: #1E5BA8;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        button:hover {
            background: #FFA500;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>🧪 Test Blog JS Industrie - Diagnostic Complet</h1>

    <div id="status"></div>

    <h2>Tests disponibles</h2>
    <button onclick="testAllFiles()">1. Tester tous les fichiers</button>
    <button onclick="testAPI()">2. Tester l'API (action=list)</button>
    <button onclick="testArticlesDisplay()">3. Tester affichage articles</button>
    <button onclick="testAdminLogin()">4. Tester login admin</button>
    <button onclick="runAllTests()">▶️ Lancer tous les tests</button>

    <div id="results"></div>

    <script>
        // Test 1: Vérifier tous les fichiers nécessaires
        async function testAllFiles() {
            const results = document.getElementById('results');
            results.innerHTML = '<h3>Test 1: Vérification des fichiers</h3>';

            const files = [
                'blog.html',
                'admin.html',
                'blog-api.php',
                'js/blog.js',
                'js/admin.js',
                'css/style.css'
            ];

            for (const file of files) {
                try {
                    const response = await fetch(file, { method: 'HEAD' });
                    const status = response.ok ? '✅' : '❌';
                    results.innerHTML += `<div class="status ${response.ok ? 'success' : 'error'}">${status} ${file} - ${response.status}</div>`;
                } catch (error) {
                    results.innerHTML += `<div class="status error">❌ ${file} - Erreur: ${error.message}</div>`;
                }
            }
        }

        // Test 2: Tester l'API
        async function testAPI() {
            const results = document.getElementById('results');
            results.innerHTML = '<h3>Test 2: Test de l\'API</h3>';

            try {
                const response = await fetch('blog-api.php?action=list');
                const contentType = response.headers.get('content-type');

                results.innerHTML += `<div class="status ${response.ok ? 'success' : 'error'}">
                    Status HTTP: ${response.status}<br>
                    Content-Type: ${contentType}
                </div>`;

                const text = await response.text();
                let data;

                try {
                    data = JSON.parse(text);
                    results.innerHTML += '<div class="status success">✅ JSON valide</div>';
                    results.innerHTML += `<pre>${JSON.stringify(data, null, 2)}</pre>`;

                    if (data.success) {
                        results.innerHTML += `<div class="status success">✅ API retourne success: true<br>Nombre d'articles: ${data.articles?.length || 0}</div>`;
                    } else {
                        results.innerHTML += `<div class="status error">❌ API retourne success: false</div>`;
                    }
                } catch (e) {
                    results.innerHTML += '<div class="status error">❌ JSON invalide</div>';
                    results.innerHTML += `<pre>Réponse brute: ${text.substring(0, 500)}</pre>`;
                }
            } catch (error) {
                results.innerHTML += `<div class="status error">❌ Erreur: ${error.message}</div>`;
            }
        }

        // Test 3: Tester affichage des articles
        async function testArticlesDisplay() {
            const results = document.getElementById('results');
            results.innerHTML = '<h3>Test 3: Affichage des articles</h3>';

            try {
                const response = await fetch('blog-api.php?action=list');
                const data = await response.json();

                if (!data.success || !data.articles || data.articles.length === 0) {
                    results.innerHTML += '<div class="status warning">⚠️ Aucun article trouvé</div>';
                    return;
                }

                results.innerHTML += `<div class="status success">✅ ${data.articles.length} article(s) trouvé(s)</div>`;

                data.articles.forEach((article, index) => {
                    results.innerHTML += `
                        <div class="article-card">
                            <h4>${index + 1}. ${article.title}</h4>
                            <p><strong>Catégorie:</strong> ${article.category}</p>
                            <p><strong>Auteur:</strong> ${article.author}</p>
                            <p><strong>Date:</strong> ${article.date}</p>
                            <p><strong>Extrait:</strong> ${article.excerpt}</p>
                            <p><strong>Slug:</strong> ${article.slug}</p>
                            <p><strong>ID:</strong> ${article.id}</p>
                        </div>
                    `;
                });
            } catch (error) {
                results.innerHTML += `<div class="status error">❌ Erreur: ${error.message}</div>`;
            }
        }

        // Test 4: Tester login admin
        async function testAdminLogin() {
            const results = document.getElementById('results');
            results.innerHTML = '<h3>Test 4: Login administrateur</h3>';

            const password = prompt('Entrez le mot de passe admin:', 'js-industrie-admin-2024');
            if (!password) {
                results.innerHTML += '<div class="status warning">⚠️ Test annulé</div>';
                return;
            }

            const formData = new FormData();
            formData.append('password', password);

            try {
                const response = await fetch('blog-api.php?action=login', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    results.innerHTML += '<div class="status success">✅ Login réussi!</div>';
                } else {
                    results.innerHTML += `<div class="status error">❌ Login échoué: ${data.message || 'Mot de passe incorrect'}</div>`;
                }

                results.innerHTML += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                results.innerHTML += `<div class="status error">❌ Erreur: ${error.message}</div>`;
            }
        }

        // Lancer tous les tests
        async function runAllTests() {
            document.getElementById('results').innerHTML = '<h2>🔄 Lancement de tous les tests...</h2>';

            await testAllFiles();
            await new Promise(r => setTimeout(r, 1000));

            await testAPI();
            await new Promise(r => setTimeout(r, 1000));

            await testArticlesDisplay();
            await new Promise(r => setTimeout(r, 1000));

            document.getElementById('results').innerHTML += '<h2>✅ Tous les tests terminés!</h2>';
        }

        // Info au chargement
        document.getElementById('status').innerHTML = `
            <div class="status success">
                <h3>Page de diagnostic chargée ✅</h3>
                <p>Cliquez sur les boutons ci-dessus pour tester chaque fonctionnalité du blog.</p>
                <p><strong>Mot de passe admin:</strong> js-industrie-admin-2024</p>
            </div>
        `;
    </script>
</body>
</html>
