<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test JSON Complet</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 { color: #4ec9b0; }
        .box {
            background: #252526;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid #007acc;
        }
        .error { border-left-color: #f48771; }
        .success { border-left-color: #4ec9b0; }
        .warning { border-left-color: #dcdcaa; }
        pre {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            max-height: 500px;
            overflow-y: auto;
            font-size: 11px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            font-family: inherit;
        }
        button:hover { background: #1177bb; }
        .stats { color: #9cdcfe; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Diagnostic JSON Tronqué</h1>

        <div class="box warning">
            <strong>Erreur détectée :</strong> "Unexpected end of JSON input"<br>
            Cela signifie que la réponse JSON est incomplète ou coupée en milieu de réponse.
        </div>

        <button onclick="testFullResponse()">▶️ Tester la réponse complète</button>
        <button onclick="testChunkedResponse()">📦 Tester par morceaux</button>

        <div id="results"></div>
    </div>

    <script>
        async function testFullResponse() {
            const results = document.getElementById('results');
            results.innerHTML = '<h2>Test de la réponse complète</h2>';

            try {
                const startTime = Date.now();
                const response = await fetch('blog-api.php?action=list', {
                    method: 'GET',
                    cache: 'no-cache'
                });
                const fetchTime = Date.now() - startTime;

                results.innerHTML += `
                    <div class="box ${response.ok ? 'success' : 'error'}">
                        <strong>⏱️ Temps de réponse:</strong> ${fetchTime}ms<br>
                        <strong>📊 Status HTTP:</strong> ${response.status} ${response.statusText}<br>
                        <strong>📋 Content-Type:</strong> ${response.headers.get('content-type')}<br>
                        <strong>📏 Content-Length:</strong> ${response.headers.get('content-length') || 'Non spécifié'}
                    </div>
                `;

                // Récupérer la réponse en texte brut
                const rawText = await response.text();
                const textLength = rawText.length;

                results.innerHTML += `
                    <div class="box">
                        <h3>📄 Réponse brute</h3>
                        <p class="stats">Longueur: ${textLength} caractères</p>
                        <p class="stats">Premier caractère: "${rawText.charAt(0)}"</p>
                        <p class="stats">Dernier caractère: "${rawText.charAt(textLength - 1)}"</p>
                        <p class="stats">Se termine par }: ${rawText.trim().endsWith('}') ? '✅ OUI' : '❌ NON'}</p>
                        <pre>${escapeHtml(rawText)}</pre>
                    </div>
                `;

                // Essayer de parser le JSON
                try {
                    const json = JSON.parse(rawText);
                    results.innerHTML += `
                        <div class="box success">
                            <h3>✅ JSON valide</h3>
                            <p class="stats">Articles: ${json.articles?.length || 0}</p>
                            <pre>${JSON.stringify(json, null, 2)}</pre>
                        </div>
                    `;
                } catch (parseError) {
                    results.innerHTML += `
                        <div class="box error">
                            <h3>❌ JSON invalide</h3>
                            <strong>Erreur:</strong> ${parseError.message}<br>
                            <strong>Position:</strong> ${parseError.message.match(/position (\d+)/) ? parseError.message.match(/position (\d+)/)[1] : 'N/A'}
                        </div>
                    `;

                    // Analyser où le JSON est coupé
                    const openBraces = (rawText.match(/{/g) || []).length;
                    const closeBraces = (rawText.match(/}/g) || []).length;
                    const openBrackets = (rawText.match(/\[/g) || []).length;
                    const closeBrackets = (rawText.match(/\]/g) || []).length;

                    results.innerHTML += `
                        <div class="box warning">
                            <h3>🔍 Analyse des accolades</h3>
                            <p>{ ouvrantes: ${openBraces} | } fermantes: ${closeBraces} ${openBraces === closeBraces ? '✅' : '❌ DÉSÉQUILIBRE'}</p>
                            <p>[ ouvrantes: ${openBrackets} | ] fermantes: ${closeBrackets} ${openBrackets === closeBrackets ? '✅' : '❌ DÉSÉQUILIBRE'}</p>
                        </div>
                    `;

                    // Afficher les 500 derniers caractères
                    const endSnippet = rawText.substring(Math.max(0, textLength - 500));
                    results.innerHTML += `
                        <div class="box">
                            <h3>📌 500 derniers caractères (où le JSON s'arrête)</h3>
                            <pre>${escapeHtml(endSnippet)}</pre>
                        </div>
                    `;
                }

            } catch (error) {
                results.innerHTML += `
                    <div class="box error">
                        <strong>❌ Erreur réseau:</strong> ${error.message}
                    </div>
                `;
            }
        }

        async function testChunkedResponse() {
            const results = document.getElementById('results');
            results.innerHTML = '<h2>Test de la réponse par morceaux</h2>';

            try {
                const response = await fetch('blog-api.php?action=list', {
                    method: 'GET',
                    cache: 'no-cache'
                });

                if (!response.body) {
                    results.innerHTML += '<div class="box error">❌ Streaming non supporté</div>';
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let receivedText = '';
                let chunks = 0;

                results.innerHTML += '<div class="box"><h3>📦 Réception des morceaux...</h3><div id="chunks"></div></div>';
                const chunksDiv = document.getElementById('chunks');

                while (true) {
                    const { done, value } = await reader.read();

                    if (done) {
                        results.innerHTML += '<div class="box success">✅ Réception terminée</div>';
                        break;
                    }

                    chunks++;
                    const chunk = decoder.decode(value, { stream: true });
                    receivedText += chunk;

                    chunksDiv.innerHTML += `<p>Chunk ${chunks}: ${chunk.length} octets reçus (Total: ${receivedText.length})</p>`;
                }

                results.innerHTML += `
                    <div class="box">
                        <h3>📊 Résumé</h3>
                        <p>Morceaux reçus: ${chunks}</p>
                        <p>Total: ${receivedText.length} caractères</p>
                        <p>Dernier caractère: "${receivedText.charAt(receivedText.length - 1)}"</p>
                    </div>
                `;

                // Essayer de parser
                try {
                    const json = JSON.parse(receivedText);
                    results.innerHTML += '<div class="box success">✅ JSON valide après réception complète</div>';
                } catch (e) {
                    results.innerHTML += `<div class="box error">❌ JSON toujours invalide: ${e.message}</div>`;
                }

            } catch (error) {
                results.innerHTML += `<div class="box error">❌ Erreur: ${error.message}</div>`;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Auto-lancer le test
        window.addEventListener('load', () => {
            setTimeout(() => testFullResponse(), 500);
        });
    </script>
</body>
</html>
