<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration Blog - JS Industrie</title>
    <link rel="icon" type="image/png" href="images/logo1.png">
    <style>
        :root {
            --primary-color: #111827;
            --secondary-color: #1E5BA8;
            --accent-color: #FFA500;
            --success: #10b981;
            --danger: #ef4444;
            --white: #ffffff;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --text-dark: #1f2937;
            --text-light: #6b7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--gray-100);
            color: var(--text-dark);
        }

        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        }

        .login-box {
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-box img {
            height: 80px;
            margin-bottom: 2rem;
        }

        .login-box h1 {
            color: var(--primary-color);
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--gray-300);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--secondary-color);
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-color), #ff8c00);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 165, 0, 0.3);
        }

        .admin-container {
            display: none;
        }

        .admin-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-header h1 {
            font-size: 1.5rem;
        }

        .btn-logout {
            background: transparent;
            border: 2px solid white;
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: white;
            color: var(--primary-color);
        }

        .admin-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .actions {
            margin-bottom: 2rem;
        }

        .btn-secondary {
            background-color: var(--secondary-color);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-secondary:hover {
            opacity: 0.9;
        }

        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .article-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .article-card:hover {
            transform: translateY(-5px);
        }

        .article-image {
            width: 100%;
            height: 200px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .article-category {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: var(--secondary-color);
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .article-body {
            padding: 1.5rem;
        }

        .article-body h3 {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .article-body p {
            color: var(--text-light);
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .article-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 1rem;
        }

        .article-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-small {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .btn-edit {
            background-color: var(--secondary-color);
            color: white;
        }

        .btn-delete {
            background-color: var(--danger);
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            max-width: 800px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            margin: 2rem;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .modal-header h2 {
            color: var(--primary-color);
        }

        .btn-close {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: var(--text-light);
        }

        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--gray-300);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            min-height: 150px;
        }

        .form-group textarea:focus {
            outline: none;
            border-color: var(--secondary-color);
        }

        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--gray-300);
            border-radius: 8px;
            font-size: 1rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .alert-success {
            background-color: #d1fae5;
            color: #065f46;
            border: 1px solid #10b981;
        }

        .alert-error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #ef4444;
        }

        .no-articles {
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 12px;
        }

        .no-articles img {
            width: 200px;
            opacity: 0.5;
            margin-bottom: 1rem;
        }

        @media (max-width: 968px) {
            .admin-content {
                padding: 1.5rem;
            }

            .modal-content {
                width: 95%;
                max-width: 95%;
                margin: 20px;
            }
        }

        @media (max-width: 768px) {
            .login-box {
                padding: 2rem 1.5rem;
                width: 90%;
            }

            .login-box img {
                max-width: 120px;
            }

            .login-box h1 {
                font-size: 1.5rem;
            }

            .admin-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
                padding: 1.5rem;
            }

            .admin-header h1 {
                font-size: 1.5rem;
            }

            .admin-content {
                padding: 1rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .articles-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                width: 95%;
                padding: 1.5rem;
            }

            .modal-header h2 {
                font-size: 1.3rem;
            }

            .actions {
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 1.5rem 1rem;
            }

            .login-box img {
                max-width: 100px;
            }

            .login-box h1 {
                font-size: 1.3rem;
            }

            .admin-header h1 {
                font-size: 1.3rem;
            }

            .btn, .btn-primary, .btn-secondary, .btn-danger {
                padding: 12px 20px;
                font-size: 0.95rem;
            }

            .form-group label {
                font-size: 0.9rem;
            }

            .form-group input,
            .form-group textarea,
            .form-group select {
                font-size: 0.95rem;
                padding: 12px;
            }

            .article-card h3 {
                font-size: 1.1rem;
            }

            .article-meta {
                font-size: 0.85rem;
            }

            .modal-header h2 {
                font-size: 1.2rem;
            }

            .no-articles h2 {
                font-size: 1.5rem;
            }

            .no-articles p {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <!-- Écran de connexion -->
    <div class="login-screen" id="loginScreen">
        <div class="login-box">
            <img src="images/logo1.png" alt="JS Industrie">
            <h1>Administration Blog</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label>Mot de passe administrateur</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary">Se connecter</button>
            </form>
            <div id="loginError" style="margin-top: 1rem; color: var(--danger); display: none;"></div>
        </div>
    </div>

    <!-- Interface d'administration -->
    <div class="admin-container" id="adminContainer">
        <div class="admin-header">
            <h1>📝 Gestion du Blog</h1>
            <button class="btn-logout" onclick="logout()">Déconnexion</button>
        </div>

        <div class="admin-content">
            <div class="actions">
                <button class="btn-secondary" onclick="openModal()">+ Nouvel Article</button>
            </div>

            <div id="alert"></div>

            <div class="articles-grid" id="articlesGrid">
                <div class="no-articles">
                    <p>Chargement des articles...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal d'édition/création -->
    <div class="modal" id="articleModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Nouvel Article</h2>
                <button class="btn-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="articleForm" enctype="multipart/form-data">
                <input type="hidden" id="articleId">

                <div class="form-group">
                    <label>Titre *</label>
                    <input type="text" id="title" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Catégorie *</label>
                        <select id="category" required>
                            <option value="">Sélectionner...</option>
                            <option value="actualites">Actualités</option>
                            <option value="projets">Projets</option>
                            <option value="technique">Technique</option>
                            <option value="securite">Sécurité</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Auteur *</label>
                        <input type="text" id="author" value="JS Industrie" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Image de couverture</label>
                    <input type="file" id="image" accept="image/*">
                    <small style="color: var(--text-light);">JPG, PNG, GIF, WebP - Max 5MB</small>
                </div>

                <div class="form-group">
                    <label>Extrait (résumé) *</label>
                    <textarea id="excerpt" required placeholder="Court résumé de l'article (2-3 phrases)"></textarea>
                </div>

                <div class="form-group">
                    <label>Contenu complet *</label>
                    <textarea id="content" required placeholder="Contenu de l'article en HTML ou texte brut" style="min-height: 300px;"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Enregistrer l'article</button>
            </form>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
